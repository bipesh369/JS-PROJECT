<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Scheme Switcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <ul class="nav-list">
      <li data-color="red">Red</li>
      <li data-color="green">Green</li>
      <li data-color="blue">Blue</li>
      <li data-color="yellow">Yellow</li>
    </ul>
  </nav>

  <h2>Color Scheme Switcher</h2>

  <!-- COLOR BOXES -->
  <div class="color-container">
    <div class="color-box red" data-color="red"></div>
    <div class="color-box green" data-color="green"></div>
    <div class="color-box blue" data-color="blue"></div>
    <div class="color-box yellow" data-color="yellow"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
